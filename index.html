                        ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                        // 穿透尾迹
                        ctx.fillStyle = 'rgba(155, 89, 182, 0.2)';
                        ctx.beginPath();
                        ctx.arc(proj.x - 5, proj.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'nuke':
                        ctx.fillStyle = '#c0392b';
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 10, 0, Math.PI * 2);
                        ctx.fill();
                        if (frameCount % 10 < 5) {
                            ctx.fillStyle = '#e74c3c';
                            ctx.beginPath();
                            ctx.arc(proj.x, proj.y, 6, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        // 辐射警示
                        ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 15 + Math.sin(frameCount * 0.2) * 5, 0, Math.PI * 2);
                        ctx.stroke();
                        break;
                }
            }
            
            // 激光束
            for (let tower of towers) {
                if (tower.type === 'laser' && tower.target) {
                    const towerData = TOWERS.laser;
                    const tx = tower.x * GRID_SIZE + GRID_SIZE/2;
                    const ty = tower.y * GRID_SIZE + GRID_SIZE/2;
                    
                    ctx.strokeStyle = towerData.color;
                    ctx.lineWidth = (towerData.beamWidth || 3) + Math.sin(frameCount * 0.5) * 1;
                    ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.3) * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(tx, ty);
                    ctx.lineTo(tower.target.x, tower.target.y);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    
                    // 激光击中点效果
                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.arc(tower.target.x, tower.target.y, 4 + Math.sin(frameCount * 0.8) * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
//                    tower.target.hp -= towerData.damage * 0.16;
                }
            }
            
            // 黑洞效果
            for (let tower of towers) {
                if (tower.type === 'blackhole') {
                    const tx = tower.x * GRID_SIZE + GRID_SIZE/2;
                    const ty = tower.y * GRID_SIZE + GRID_SIZE/2;
                    
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(frameCount * 0.05);
                    
                    for (let i = 0; i < 3; i++) {
                        ctx.rotate(Math.PI * 2 / 3);
                        ctx.strokeStyle = `rgba(44, 62, 80, ${0.4 + Math.sin(frameCount * 0.1) * 0.3})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(0, 0, 18 + i * 10, 0, Math.PI * 1.5);
                        ctx.stroke();
                    }
                    
                    ctx.restore();
                    
                    // 事件视界
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.beginPath();
                    ctx.arc(tx, ty, 12, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 吸积盘
                    ctx.strokeStyle = `rgba(233, 69, 96, ${0.3 + Math.sin(frameCount * 0.15) * 0.2})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(tx, ty, 20 + Math.sin(frameCount * 0.1) * 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // 粒子
            for (let p of particles) {
                ctx.globalAlpha = p.life / 40;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / 40), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', CANVAS_WIDTH/2, CANVAS_HEIGHT/2);
            }
        }

        function updateUI() {
            document.getElementById('gold').textContent = Math.floor(gold);
            document.getElementById('hp').textContent = hp;
            document.getElementById('wave').textContent = wave;
            document.getElementById('kills').textContent = kills;
        }

        function log(message) {
            const logEl = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
            
            while (logEl.children.length > 20) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
