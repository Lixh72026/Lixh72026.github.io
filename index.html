<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔防-无限进化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        /* 修复：全屏时防止界面拉长，锁定比例 */
        .game-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 1200px;
        }

        .canvas-container {
            /* 锁定画布容器比例 */
            flex: 0 0 auto;
            width: 600px;
            max-width: 100%;
            aspect-ratio: 6 / 5;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            border: 2px solid #0f3460;
            border-radius: 10px;
            background: #0a0a1a;
            cursor: crosshair;
            display: block;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
            min-width: 200px;
            max-width: 100%;
            flex: 0 0 auto;
        }

        /* 响应式：小屏幕时堆叠 */
        @media (max-width: 860px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .canvas-container {
                width: 100%;
                max-width: 600px;
            }
            .side-panel {
                width: 100%;
                max-width: 600px;
            }
        }

        /* 超宽屏限制 */
        @media (min-width: 1400px) {
            .canvas-container {
                width: 700px;
            }
        }

        .top-bar {
            display: flex;
            gap: 20px;
            padding: 10px 20px;
            background: #16213e;
            border-radius: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .stat-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .gold-icon { background: #ffd700; color: #333; }
        .hp-icon { background: #e74c3c; }
        .wave-icon { background: #3498db; }
        .kill-icon { background: #9b59b6; }

        .tower-shop {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
        }

        .shop-title {
            text-align: center;
            margin-bottom: 10px;
            color: #e94560;
            font-size: 16px;
        }

        .tower-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tower-btn {
            padding: 8px 5px;
            border: 2px solid #0f3460;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 12px;
            position: relative;
        }

        .tower-btn:hover {
            border-color: #e94560;
            transform: scale(1.05);
        }

        .tower-btn.selected {
            border-color: #e94560;
            background: #0f3460;
        }

        .tower-btn .tower-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .tower-btn .tower-price {
            color: #ffd700;
            font-size: 11px;
        }

        .tower-btn .tower-desc {
            color: #888;
            font-size: 10px;
            margin-top: 2px;
        }

        .price-inflated {
            color: #e74c3c !important;
            font-weight: bold;
        }

        .price-original {
            text-decoration: line-through;
            color: #888;
            font-size: 9px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            flex: 1;
            min-width: 70px;
        }

        .btn-start { background: #27ae60; color: white; }
        .btn-start:hover { background: #2ecc71; }
        .btn-pause { background: #f39c12; color: white; }
        .btn-reset { background: #e74c3c; color: white; }

        /* 存档系统 */
        .save-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
        }

        .save-title {
            text-align: center;
            color: #e94560;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .save-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .save-btn {
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            flex: 1;
            min-width: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .save-btn-save { background: #2980b9; color: white; }
        .save-btn-save:hover { background: #3498db; }
        .save-btn-load { background: #16a085; color: white; }
        .save-btn-load:hover { background: #1abc9c; }
        .save-btn-export { background: #8e44ad; color: white; }
        .save-btn-export:hover { background: #9b59b6; }
        .save-btn-import { background: #d35400; color: white; }
        .save-btn-import:hover { background: #e67e22; }
        .save-btn-share { background: #c0392b; color: white; }
        .save-btn-share:hover { background: #e74c3c; }
        .save-btn-delete { background: #7f8c8d; color: white; }
        .save-btn-delete:hover { background: #95a5a6; }

        .save-status {
            text-align: center;
            font-size: 11px;
            color: #888;
            padding: 5px;
            min-height: 20px;
        }

        .save-status.has-save {
            color: #2ecc71;
        }

        .difficulty {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
        }

        .difficulty-title {
            text-align: center;
            margin-bottom: 8px;
            color: #e94560;
            font-size: 14px;
        }

        .diff-options {
            display: flex;
            gap: 5px;
        }

        .diff-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .diff-btn.active {
            border-color: #e94560;
            background: #0f3460;
        }

        .game-log {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #0f3460;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .tower-info {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            min-height: 80px;
        }

        .info-title {
            color: #e94560;
            margin-bottom: 5px;
        }

        .wave-progress {
            background: #16213e;
            border-radius: 10px;
            padding: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: #e94560;
            transition: width 0.3s;
            border-radius: 10px;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .game-over-content {
            background: #16213e;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        .game-over h2 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .game-over p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal-content {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            color: #e94560;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-text {
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .share-link-box {
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            word-break: break-all;
            font-size: 12px;
            color: #3498db;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-btn-confirm { background: #27ae60; color: white; }
        .modal-btn-cancel { background: #7f8c8d; color: white; }

        .damage-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .buff-indicator {
            position: absolute;
            font-size: 10px;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部信息栏 -->
    <div class="top-bar">
        <div class="stat">
            <span class="stat-icon gold-icon">💰</span>
            <span id="gold">800</span>
        </div>
        <div class="stat">
            <span class="stat-icon hp-icon">❤️</span>
            <span id="hp">20</span>
        </div>
        <div class="stat">
            <span class="stat-icon wave-icon">🌊</span>
            <span>波次: <span id="wave">0</span></span>
        </div>
        <div class="stat">
            <span class="stat-icon kill-icon">⚔️</span>
            <span>击杀: <span id="kills">0</span></span>
        </div>
        <div class="stat">
            <span>难度: <span id="diff-display">普通</span></span>
        </div>
    </div>

    <!-- 游戏主区域 - 修复全屏拉长 -->
    <div class="game-wrapper">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
        </div>
        
        <div class="side-panel">
            <!-- 难度选择 -->
            <div class="difficulty">
                <div class="difficulty-title">难度选择</div>
                <div class="diff-options">
                    <button class="diff-btn active" onclick="setDifficulty('normal')">普通</button>
                    <button class="diff-btn" onclick="setDifficulty('hard')">困难</button>
                    <button class="diff-btn" onclick="setDifficulty('hell')">地狱</button>
                </div>
            </div>

            <!-- 塔商店 -->
            <div class="tower-shop">
                <div class="shop-title">防御塔商店</div>
                <div class="tower-grid" id="towerShop">
                </div>
            </div>

            <!-- 选中塔信息 -->
            <div class="tower-info" id="towerInfo">
                <div class="info-title">点击选择防御塔</div>
                <div>在地图上点击放置</div>
            </div>

            <!-- 波次进度 -->
            <div class="wave-progress">
                <div>当前波次进度</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="waveProgress" style="width: 0%"></div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="toggleWave()">开始波次</button>
                <button class="btn btn-pause" onclick="togglePause()">暂停</button>
                <button class="btn btn-reset" onclick="resetGame()">重置</button>
            </div>

            <!-- ============ 存档系统 UI ============ -->
            <div class="save-controls">
                <div class="save-title">💾 存档管理</div>
                <div class="save-row">
                    <button class="save-btn save-btn-save" onclick="manualSave()" title="保存到浏览器">💾 保存</button>
                    <button class="save-btn save-btn-load" onclick="manualLoad()" title="读取上次存档">📂 读取</button>
                </div>
                <div class="save-row">
                    <button class="save-btn save-btn-export" onclick="exportSaveFile()" title="下载存档文件">📤 导出</button>
                    <button class="save-btn save-btn-import" onclick="triggerImport()" title="从文件恢复">📥 导入</button>
                </div>
                <div class="save-row">
                    <button class="save-btn save-btn-share" onclick="shareConfig()" title="生成分享链接">🔗 分享</button>
                    <button class="save-btn save-btn-delete" onclick="confirmDeleteSave()" title="清除所有存档">🗑️ 清除</button>
                </div>
                <div class="save-status" id="saveStatus">暂无本地存档</div>
            </div>

            <!-- 游戏日志 -->
            <div class="game-log" id="gameLog">
                <div class="log-entry">欢迎来到塔防-无限进化！</div>
                <div class="log-entry">选择难度，建造防御塔，抵御怪物进攻！</div>
                <div class="log-entry">💡 提示：每波结束自动存档，也可手动保存</div>
            </div>
        </div>
    </div>

    <!-- 游戏结束画面 -->
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 id="gameOverTitle">游戏结束</h2>
            <p id="gameOverText"></p>
            <button class="btn btn-start" onclick="resetGame()">再来一局</button>
        </div>
    </div>

    <!-- 通用弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-text" id="modalText"></div>
            <div id="modalExtra"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm" id="modalConfirm">确定</button>
                <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 隐藏文件输入 -->
    <input type="file" id="fileInput" accept=".json" onchange="handleFileImport(event)">

    <script>
        // ============ 游戏配置 ============
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 500;
        const GRID_SIZE = 40;
        const COLS = CANVAS_WIDTH / GRID_SIZE;
        const ROWS = CANVAS_HEIGHT / GRID_SIZE;

        const DIFFICULTY = {
            normal: { name: '普通', hpMult: 1, speedMult: 1, rewardMult: 1, waveInterval: 3000, eliteChance: 0.1 },
            hard: { name: '困难', hpMult: 1.5, speedMult: 1.3, rewardMult: 0.8, waveInterval: 2500, eliteChance: 0.25, specialEnemies: true },
            hell: { name: '地狱', hpMult: 2.5, speedMult: 1.6, rewardMult: 0.6, waveInterval: 2000, eliteChance: 0.4, specialEnemies: true, dynamicPath: true, priceInflation: true }
        };

        const TOWERS = {
            basic: { name: '基础', price: 50, damage: 15, range: 2.5, fireRate: 1000, color: '#95a5a6', desc: '均衡的入门塔', projectile: 'bullet', projectileSpeed: 10, hitRadius: 15 },
            rapid: { name: '速射', price: 100, damage: 8, range: 2, fireRate: 300, color: '#e74c3c', desc: '超高攻速，低伤害', projectile: 'bullet', projectileSpeed: 12, hitRadius: 12 },
            heavy: { name: '重型', price: 150, damage: 50, range: 2, fireRate: 2000, color: '#8e44ad', desc: '高伤害，慢攻速', projectile: 'cannon', projectileSpeed: 7, splash: 1, hitRadius: 20 },
            sniper: { name: '狙击', price: 200, damage: 100, range: 5, fireRate: 2500, color: '#2ecc71', desc: '超远射程，精准打击', projectile: 'laser', projectileSpeed: 25, pierce: true, pierceCount: 3, pierceDamageRetain: 0.8, hitRadius: 15, aimAssist: true },
            laser: { name: '激光', price: 250, damage: 5, range: 3, fireRate: 100, color: '#e94560', desc: '持续伤害，可叠加', projectile: 'beam', beamWidth: 3 },
            missile: { name: '导弹', price: 300, damage: 80, range: 4, fireRate: 2000, color: '#f39c12', desc: '追踪导弹，范围伤害', projectile: 'missile', projectileSpeed: 5, splash: 2, homing: true, hitRadius: 20 },
            flame: { name: '火焰', price: 180, damage: 3, range: 2, fireRate: 100, color: '#e67e22', desc: '持续灼烧，范围伤害', projectile: 'flame', projectileSpeed: 6, splash: 1.5, dot: true, hitRadius: 18 },
            ice: { name: '冰冻', price: 150, damage: 5, range: 2.5, fireRate: 1500, color: '#3498db', desc: '强力减速，范围冰冻', projectile: 'ice', projectileSpeed: 8, splash: 1.5, slow: 0.7, slowDuration: 3000, flyingSlowBonus: 0.2, flyingSlowDurationBonus: 2, hitRadius: 15 },
            shock: { name: '电击', price: 220, damage: 25, range: 3, fireRate: 1200, color: '#f1c40f', desc: '链式电击，弹射4次', projectile: 'lightning', projectileSpeed: 15, chain: 4, chainRange: 3.5, chainDamageDecay: 0.2, hitRadius: 20 },
            poison: { name: '毒素', price: 160, damage: 2, range: 2.5, fireRate: 800, color: '#27ae60', desc: '中毒+易伤，全塔增伤', projectile: 'poison', projectileSpeed: 8, dot: true, dotDuration: 5000, dotDamage: 12, vulnerable: true, vulnerableMult: 1.3, vulnerableDuration: 5000, hitRadius: 15 },
            plasma: { name: '等离子', price: 400, damage: 32, range: 3.5, fireRate: 800, color: '#9b59b6', desc: '穿透4个敌人', projectile: 'plasma', projectileSpeed: 9, pierce: true, pierceCount: 4, hitRadius: 12 },
            blackhole: { name: '黑洞', price: 500, damage: 10, range: 2, fireRate: 100, color: '#2c3e50', desc: '吸引敌人，飞行怪减半', projectile: 'blackhole', pullRadius: 3.5, pullStrength: 0.4, flyingPullMult: 0.5, centerDamageRadius: 40, hitRadius: 20 },
            nuke: { name: '核弹', price: 800, damage: 500, range: 5, fireRate: 5000, color: '#c0392b', desc: '毁灭性范围伤害', projectile: 'nuke', projectileSpeed: 3, splash: 4, chargeTime: 2000, hitRadius: 30 }
        };

        const ENEMIES = {
            basic: { name: '普通怪', hp: 50, speed: 1, reward: 10, color: '#e74c3c', radius: 12 },
            fast: { name: '快速怪', hp: 30, speed: 2, reward: 15, color: '#f39c12', radius: 10 },
            tank: { name: '坦克怪', hp: 150, speed: 0.5, reward: 25, color: '#8e44ad', radius: 16 },
            elite: { name: '精英怪', hp: 300, speed: 1.2, reward: 50, color: '#c0392b', radius: 18, armor: 0.3 },
            splitter: { name: '分裂怪', hp: 80, speed: 1, reward: 20, color: '#27ae60', radius: 14, split: true },
            teleporter: { name: '瞬移怪', hp: 60, speed: 1.3, reward: 30, color: '#3498db', radius: 12, teleport: true },
            flying: { name: '飞行怪', hp: 40, speed: 1.5, reward: 20, color: '#9b59b6', radius: 11, flying: true },
            boss: { name: 'BOSS', hp: 2000, speed: 0.3, reward: 200, color: '#e94560', radius: 25, armor: 0.5, boss: true }
        };

        // ============ 游戏状态 ============
        let canvas, ctx;
        let gameState = 'idle';
        let currentDifficulty = 'normal';
        let gold = 800;
        let hp = 20;
        let wave = 0;
        let kills = 0;
        let selectedTower = null;
        let towers = [];
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let waveEnemies = [];
        let waveSpawnTimer = 0;
        let waveSpawnIndex = 0;
        let frameCount = 0;
        let mouseX = 0, mouseY = 0;
        let towerCounts = {};
        let pathCells = [];
        let currentPath = [];

        const PATHS = [
            [[0,2],[3,2],[3,5],[7,5],[7,2],[11,2],[11,7],[5,7],[5,9],[14,9]],
            [[0,4],[4,4],[4,1],[8,1],[8,8],[12,8],[12,3],[14,3]],
            [[0,1],[2,1],[2,6],[5,6],[5,2],[9,2],[9,7],[12,7],[12,4],[14,4]]
        ];

        const SAVE_KEY = 'towerDefense_save_v1';

        // ============ 存档系统核心 ============

        function getSaveData() {
            return {
                version: '1.0',
                timestamp: Date.now(),
                gold: gold,
                hp: hp,
                wave: wave,
                kills: kills,
                currentDifficulty: currentDifficulty,
                towerCounts: towerCounts,
                towers: towers.map(t => ({ type: t.type, x: t.x, y: t.y })),
                pathIndex: PATHS.findIndex(p => p.length === currentPath.length && p.every((pt, i) => pt[0] === currentPath[i].x && pt[1] === currentPath[i].y)),
                gameState: gameState
            };
        }

        function saveToLocal() {
            const data = getSaveData();
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            updateSaveStatus();
            return true;
        }

        function loadFromLocal() {
            const saveStr = localStorage.getItem(SAVE_KEY);
            if (!saveStr) return null;
            try { return JSON.parse(saveStr); } catch { return null; }
        }

        function hasSave() {
            return !!localStorage.getItem(SAVE_KEY);
        }

        function updateSaveStatus() {
            const statusEl = document.getElementById('saveStatus');
            const save = loadFromLocal();
            if (save) {
                const date = new Date(save.timestamp);
                const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
                statusEl.innerHTML = `✅ 存档: 波次${save.wave} | ${save.currentDifficulty} | ${timeStr}`;
                statusEl.classList.add('has-save');
            } else {
                statusEl.textContent = '暂无本地存档';
                statusEl.classList.remove('has-save');
            }
        }

        function applySaveData(save) {
            gold = save.gold;
            hp = save.hp;
            wave = save.wave;
            kills = save.kills;
            currentDifficulty = save.currentDifficulty || 'normal';
            towerCounts = save.towerCounts || {};
            if (save.pathIndex >= 0 && save.pathIndex < PATHS.length) setPath(save.pathIndex);
            towers = (save.towers || []).map(t => ({
                type: t.type, x: t.x, y: t.y,
                lastFire: 0, angle: 0, target: null, chargeTimer: 0
            }));
            updateUI();
            refreshShopPrices();
        }

        // ============ 存档UI操作 ============

        function manualSave() {
            if (gameState === 'gameover') {
                showModal('无法保存', '游戏已结束，无法保存此状态。', false);
                return;
            }
            saveToLocal();
            log('✅ 游戏已手动保存到本地！');
            showModal('保存成功', `已保存：波次${wave} | 金币${gold} | 难度${DIFFICULTY[currentDifficulty].name}`, false);
        }

        function manualLoad() {
            const save = loadFromLocal();
            if (!save) {
                showModal('没有找到存档', '本地存储中没有找到存档数据。请先进行游戏并保存。', false);
                return;
            }
            showModal('确认读取存档', `找到存档：波次${save.wave} | 金币${save.gold} | 难度${save.currentDifficulty}<br>当前进度将丢失，是否继续？`, true, () => {
                gameState = 'idle';
                enemies = [];
                projectiles = [];
                particles = [];
                waveEnemies = [];
                applySaveData(save);
                document.getElementById('startBtn').textContent = '开始波次';
                log('📂 存档已读取！');
                updateSaveStatus();
            });
        }

        function exportSaveFile() {
            if (gameState === 'gameover' && wave === 0) {
                showModal('无法导出', '当前没有可导出的游戏进度。', false);
                return;
            }
            const data = getSaveData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `塔防存档_波次${wave}_${currentDifficulty}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log('📤 存档文件已导出！');
            showModal('导出成功', '存档文件已下载，可用于备份或转移到其他设备。', false);
        }

        function triggerImport() {
            document.getElementById('fileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const save = JSON.parse(e.target.result);
                    if (!save.version || !save.towers || save.wave === undefined) throw new Error('无效的存档格式');
                    showModal('确认导入存档', `文件: ${file.name}<br>波次: ${save.wave} | 金币: ${save.gold}<br>是否覆盖当前进度？`, true, () => {
                        gameState = 'idle';
                        enemies = []; projectiles = []; particles = []; waveEnemies = [];
                        applySaveData(save);
                        saveToLocal();
                        document.getElementById('startBtn').textContent = '开始波次';
                        log('📥 存档导入成功！');
                        updateSaveStatus();
                    });
                } catch (err) {
                    showModal('导入失败', '无法读取该文件，可能不是有效的存档或已损坏。<br>错误: ' + err.message, false);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function shareConfig() {
            const state = {
                d: currentDifficulty[0],
                w: wave,
                g: gold,
                h: hp,
                k: kills,
                t: towers.map(t => [t.type, t.x, t.y])
            };
            try {
                const json = JSON.stringify(state);
                const encoded = btoa(encodeURIComponent(json));
                const shareURL = location.origin + location.pathname + '#' + encoded;
                navigator.clipboard.writeText(shareURL).then(() => {
                    showModal('分享链接已生成', `<div class="share-link-box">${shareURL}</div>链接已复制到剪贴板！<br>发送给朋友即可分享此配置。`, false);
                    log('🔗 分享链接已生成并复制！');
                }).catch(() => {
                    showModal('分享链接已生成', `<div class="share-link-box">${shareURL}</div>请手动复制上方链接发送给朋友。`, false);
                });
            } catch (err) {
                showModal('生成失败', '当前配置过大，无法生成分享链接。', false);
            }
        }

        function confirmDeleteSave() {
            if (!hasSave()) {
                showModal('无需清除', '当前没有本地存档。', false);
                return;
            }
            showModal('⚠️ 确认清除存档', '这将永久删除所有本地存档数据，且无法恢复！<br>确定要继续吗？', true, () => {
                localStorage.removeItem(SAVE_KEY);
                updateSaveStatus();
                log('🗑️ 本地存档已清除');
                showModal('已清除', '所有本地存档数据已删除。', false);
            });
        }

        // ============ 弹窗工具 ============
        function showModal(title, text, needConfirm, onConfirm) {
            const overlay = document.getElementById('modalOverlay');
            const titleEl = document.getElementById('modalTitle');
            const textEl = document.getElementById('modalText');
            const confirmBtn = document.getElementById('modalConfirm');
            const cancelBtn = document.getElementById('modalCancel');
            
            titleEl.textContent = title;
            textEl.innerHTML = text;
            overlay.style.display = 'flex';
            
            const newConfirm = confirmBtn.cloneNode(true);
            const newCancel = cancelBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
            
            if (needConfirm) {
                newConfirm.style.display = 'block';
                newCancel.textContent = '取消';
                newConfirm.onclick = () => { overlay.style.display = 'none'; if (onConfirm) onConfirm(); };
                newCancel.onclick = () => { overlay.style.display = 'none'; };
            } else {
                newConfirm.style.display = 'none';
                newCancel.textContent = '确定';
                newCancel.onclick = () => { overlay.style.display = 'none'; };
            }
        }

        function autoSave() {
            if (gameState !== 'gameover' && (wave > 0 || towers.length > 0)) {
                saveToLocal();
                log('💾 自动存档完成');
            }
        }

        function loadFromURL() {
            if (!location.hash || location.hash.length < 5) return false;
            try {
                const decoded = decodeURIComponent(atob(location.hash.slice(1)));
                const state = JSON.parse(decoded);
                if (!state.t || !Array.isArray(state.t)) return false;
                
                currentDifficulty = {n:'normal', h:'hard', _:'hell'}[state.d] || 'normal';
                wave = state.w || 0;
                gold = state.g || 800;
                hp = state.h || 20;
                kills = state.k || 0;
                towerCounts = {};
                
                towers = state.t.map(([type, x, y]) => {
                    towerCounts[type] = (towerCounts[type] || 0) + 1;
                    return { type, x, y, lastFire: 0, angle: 0, target: null, chargeTimer: 0 };
                });
                
                log('🔗 已从分享链接加载配置！');
                return true;
            } catch { return false; }
        }

        // ============ 初始化 ============
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            setPath(0);
            generateShop();
            
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('click', onCanvasClick);
            
            // 修复：监听容器尺寸变化，保持画布比例
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = CANVAS_WIDTH * dpr;
                    canvas.height = CANVAS_HEIGHT * dpr;
                    ctx.scale(dpr, dpr);
                }
            });
            resizeObserver.observe(document.querySelector('.canvas-container'));
            
            const fromURL = loadFromURL();
            if (!fromURL) {
                const localSave = loadFromLocal();
                if (localSave) {
                    showModal('发现本地存档', `波次${localSave.wave} | 金币${localSave.gold} | 难度${localSave.currentDifficulty}<br>是否继续上次进度？`, true, () => {
                        applySaveData(localSave);
                        log('📂 已自动恢复上次进度');
                    });
                }
            }
            
            updateSaveStatus();
            requestAnimationFrame(gameLoop);
            log('游戏初始化完成！');
        }

        function getTowerPrice(type) {
            const towerData = TOWERS[type];
            let price = towerData.price;
            if (DIFFICULTY[currentDifficulty].priceInflation) {
                const count = towerCounts[type] || 0;
                price = Math.floor(price * (1 + count * 0.2));
            }
            return price;
        }

        function generateShop() {
            const shop = document.getElementById('towerShop');
            shop.innerHTML = '';
            for (let key in TOWERS) {
                const tower = TOWERS[key];
                const actualPrice = getTowerPrice(key);
                const originalPrice = tower.price;
                const isInflated = actualPrice > originalPrice;
                
                const btn = document.createElement('button');
                btn.className = 'tower-btn';
                btn.dataset.towerType = key;
                btn.innerHTML = `
                    <div class="tower-name">${tower.name}</div>
                    <div class="tower-price ${isInflated ? 'price-inflated' : ''}">
                        ${isInflated ? `<span class="price-original">💰${originalPrice}</span> ` : ''}💰${actualPrice}
                    </div>
                    <div class="tower-desc">${tower.desc}</div>
                `;
                btn.onclick = () => selectTower(key, btn);
                shop.appendChild(btn);
            }
        }

        function refreshShopPrices() {
            document.querySelectorAll('.tower-btn').forEach(btn => {
                const type = btn.dataset.towerType;
                const tower = TOWERS[type];
                const actualPrice = getTowerPrice(type);
                const originalPrice = tower.price;
                const isInflated = actualPrice > originalPrice;
                
                const priceEl = btn.querySelector('.tower-price');
                priceEl.className = 'tower-price ' + (isInflated ? 'price-inflated' : '');
                priceEl.innerHTML = isInflated 
                    ? `<span class="price-original">💰${originalPrice}</span> 💰${actualPrice}`
                    : `💰${actualPrice}`;
            });
        }

        function selectTower(type, btnElement) {
            selectedTower = type;
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            
            const tower = TOWERS[type];
            const actualPrice = getTowerPrice(type);
            
            document.getElementById('towerInfo').innerHTML = `
                <div class="info-title">${tower.name}塔</div>
                <div>伤害: ${tower.damage} | 射程: ${tower.range}格</div>
                <div>攻速: ${(1000/tower.fireRate).toFixed(1)}/秒 | 当前价格: 💰${actualPrice}</div>
                <div style="color: #888; margin-top: 5px;">${tower.desc}</div>
            `;
        }

        function setDifficulty(diff) {
            currentDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('diff-display').textContent = DIFFICULTY[diff].name;
            
            if (DIFFICULTY[diff].dynamicPath) {
                setPath(Math.floor(Math.random() * PATHS.length));
                log('地狱模式：路径已随机改变！');
            }
            
            resetGame();
        }

        function setPath(pathIndex) {
            currentPath = PATHS[pathIndex % PATHS.length].map(p => ({ x: p[0], y: p[1] }));
            pathCells = [];
            for (let i = 0; i < currentPath.length - 1; i++) {
                let start = currentPath[i];
                let end = currentPath[i + 1];
                let dx = Math.sign(end.x - start.x);
                let dy = Math.sign(end.y - start.y);
                let x = start.x, y = start.y;
                while (x !== end.x || y !== end.y) {
                    pathCells.push({ x, y });
                    x += dx;
                    y += dy;
                }
            }
            pathCells.push(currentPath[currentPath.length - 1]);
        }

        function toggleWave() {
            if (gameState === 'idle' || (gameState === 'wave' && waveEnemies.length === 0)) {
                startWave();
            }
        }

        function startWave() {
            wave++;
            gameState = 'wave';
            waveSpawnIndex = 0;
            waveSpawnTimer = 0;
            waveEnemies = generateWave(wave);
            document.getElementById('startBtn').textContent = '波次进行中...';
            document.getElementById('wave').textContent = wave;
            log(`第${wave}波开始！敌人数量: ${waveEnemies.length}`);
        }

        function generateWave(waveNum) {
            const diff = DIFFICULTY[currentDifficulty];
            const enemies = [];
            const count = 5 + waveNum * 3;
            for (let i = 0; i < count; i++) {
                let type = 'basic';
                if (waveNum >= 3 && Math.random() < 0.3) type = 'fast';
                if (waveNum >= 5 && Math.random() < 0.2) type = 'tank';
                if (waveNum >= 7 && Math.random() < diff.eliteChance) type = 'elite';
                if (diff.specialEnemies) {
                    if (waveNum >= 4 && Math.random() < 0.15) type = 'splitter';
                    if (waveNum >= 6 && Math.random() < 0.15) type = 'teleporter';
                    if (waveNum >= 8 && Math.random() < 0.2) type = 'flying';
                }
                if (waveNum % 10 === 0 && i === 0) type = 'boss';
                enemies.push({ type: type, spawnDelay: i * (diff.waveInterval / count) });
            }
            return enemies;
        }

        function togglePause() {
            if (gameState === 'wave') {
                gameState = 'paused';
                log('游戏已暂停');
            } else if (gameState === 'paused') {
                gameState = 'wave';
                log('游戏继续');
            }
        }

        function resetGame() {
            gameState = 'idle';
            gold = 800;
            hp = 20;
            wave = 0;
            kills = 0;
            towers = [];
            enemies = [];
            projectiles = [];
            particles = [];
            waveEnemies = [];
            towerCounts = {};
            
            if (DIFFICULTY[currentDifficulty].dynamicPath) {
                setPath(Math.floor(Math.random() * PATHS.length));
            }
            
            updateUI();
            refreshShopPrices();
            document.getElementById('startBtn').textContent = '开始波次';
            document.getElementById('gameOver').style.display = 'none';
            log('游戏已重置');
        }

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('gameOverTitle').textContent = hp <= 0 ? '游戏失败' : '恭喜通关！';
            document.getElementById('gameOverText').textContent = 
                `存活波次: ${wave} | 击杀敌人: ${kills} | 剩余金币: ${gold}`;
            document.getElementById('gameOver').style.display = 'flex';
        }

        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            // 修复：考虑画布实际显示尺寸与逻辑尺寸的缩放比
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
        }

        function onCanvasClick(e) {
            if (!selectedTower || gameState === 'gameover') return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;
            
            const gridX = Math.floor(clickX / GRID_SIZE);
            const gridY = Math.floor(clickY / GRID_SIZE);
            
            if (isPath(gridX, gridY)) {
                log('不能在路径上放置防御塔！');
                return;
            }
            if (towers.some(t => t.x === gridX && t.y === gridY)) {
                log('该位置已有防御塔！');
                return;
            }
            
            const price = getTowerPrice(selectedTower);
            if (gold < price) {
                log('金币不足！');
                return;
            }
            
            gold -= price;
            towerCounts[selectedTower] = (towerCounts[selectedTower] || 0) + 1;
            towers.push({
                type: selectedTower,
                x: gridX,
                y: gridY,
                lastFire: 0,
                angle: 0,
                target: null,
                chargeTimer: 0
            });
            
            createParticles(gridX * GRID_SIZE + GRID_SIZE/2, gridY * GRID_SIZE + GRID_SIZE/2, TOWERS[selectedTower].color, 10);
            updateUI();
            refreshShopPrices();
            log(`放置了${TOWERS[selectedTower].name}塔！花费💰${price}`);
        }

        function isPath(x, y) {
            return pathCells.some(p => p.x === x && p.y === y);
        }

        // ============ 游戏主循环 ============
        function gameLoop(timestamp) {
            frameCount++;
            if (gameState === 'wave') {
                update(timestamp);
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        function update(timestamp) {
            const diff = DIFFICULTY[currentDifficulty];
            
            if (waveSpawnIndex < waveEnemies.length) {
                waveSpawnTimer += 16;
                if (waveSpawnTimer >= waveEnemies[waveSpawnIndex].spawnDelay) {
                    spawnEnemy(waveEnemies[waveSpawnIndex].type);
                    waveSpawnIndex++;
                    waveSpawnTimer = 0;
                }
            }
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                updateEnemy(enemy, diff);
                
                if (enemy.pathIndex >= currentPath.length - 1) {
                    hp--;
                    enemies.splice(i, 1);
                    updateUI();
                    if (hp <= 0) {
                        gameOver();
                        return;
                    }
                    continue;
                }
                
                if (enemy.hp <= 0) {
                    const enemyData = ENEMIES[enemy.type];
                    if (enemy.split && !enemy.isChild) {
                        for (let j = 0; j < 2; j++) {
                            enemies.push({
                                type: 'basic',
                                x: enemy.x,
                                y: enemy.y,
                                hp: ENEMIES.basic.hp * diff.hpMult,
                                maxHp: ENEMIES.basic.hp * diff.hpMult,
                                speed: ENEMIES.basic.speed * diff.speedMult,
                                pathIndex: enemy.pathIndex,
                                pathProgress: enemy.pathProgress,
                                isChild: true,
                                slowTimer: 0,
                                dotTimer: 0,
                                dotDamage: 0,
                                vulnerableTimer: 0
                            });
                        }
                    }
                    gold += enemyData.reward * diff.rewardMult;
                    kills++;
                    createParticles(enemy.x, enemy.y, enemyData.color, 8);
                    enemies.splice(i, 1);
                    updateUI();
                    continue;
                }
            }
            
            towers.forEach(tower => updateTower(tower, timestamp));
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                updateProjectile(proj);
                if (proj.life <= 0 || proj.hit) {
                    projectiles.splice(i, 1);
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].life--;
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            
            // 波次结束 → 自动存档
            if (waveSpawnIndex >= waveEnemies.length && enemies.length === 0 && gameState === 'wave') {
                gameState = 'idle';
                document.getElementById('startBtn').textContent = '开始波次';
                gold += 50 + wave * 10;
                updateUI();
                autoSave();
                log(`第${wave}波完成！获得波次奖励，已自动存档`);
            }
            
            const progress = waveEnemies.length > 0 ? (waveSpawnIndex / waveEnemies.length) * 100 : 0;
            document.getElementById('waveProgress').style.width = progress + '%';
        }

        function spawnEnemy(type) {
            const diff = DIFFICULTY[currentDifficulty];
            const enemyData = ENEMIES[type];
            enemies.push({
                type: type,
                x: currentPath[0].x * GRID_SIZE + GRID_SIZE/2,
                y: currentPath[0].y * GRID_SIZE + GRID_SIZE/2,
                hp: enemyData.hp * diff.hpMult * (1 + wave * 0.1),
                maxHp: enemyData.hp * diff.hpMult * (1 + wave * 0.1),
                speed: enemyData.speed * diff.speedMult,
                pathIndex: 0,
                pathProgress: 0,
                slowTimer: 0,
                dotTimer: 0,
                dotDamage: 0,
                vulnerableTimer: 0,
                teleportTimer: type === 'teleporter' ? 2000 : 0
            });
        }

        function updateEnemy(enemy, diff) {
            const enemyData = ENEMIES[enemy.type];
            let currentSpeed = enemy.speed;
            if (enemy.slowTimer > 0) {
                currentSpeed *= (1 - (enemy.slowAmount || 0.5));
                enemy.slowTimer -= 16;
            }
            if (enemy.dotTimer > 0) {
                enemy.hp -= enemy.dotDamage * (16 / 1000);
                enemy.dotTimer -= 16;
            }
            if (enemy.vulnerableTimer > 0) enemy.vulnerableTimer -= 16;
            
            if (enemyData.teleport) {
                enemy.teleportTimer -= 16;
                if (enemy.teleportTimer <= 0) {
                    enemy.teleportTimer = 3000;
                    enemy.pathIndex = Math.min(enemy.pathIndex + 2, currentPath.length - 2);
                    const target = currentPath[enemy.pathIndex];
                    enemy.x = target.x * GRID_SIZE + GRID_SIZE/2;
                    enemy.y = target.y * GRID_SIZE + GRID_SIZE/2;
                    createParticles(enemy.x, enemy.y, '#3498db', 5);
                }
            }
            
            const target = currentPath[enemy.pathIndex + 1];
            if (!target) return;
            const tx = target.x * GRID_SIZE + GRID_SIZE/2;
            const ty = target.y * GRID_SIZE + GRID_SIZE/2;
            const dx = tx - enemy.x;
            const dy = ty - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 2) {
                enemy.pathIndex++;
                enemy.pathProgress = 0;
            } else {
                enemy.x += (dx / dist) * currentSpeed;
                enemy.y += (dy / dist) * currentSpeed;
            }
        }

        // ============ 修复：防御塔瞄准逻辑，切换目标不重置冷却 ============
        function updateTower(tower, timestamp) {
            const towerData = TOWERS[tower.type];
            const tx = tower.x * GRID_SIZE + GRID_SIZE/2;
            const ty = tower.y * GRID_SIZE + GRID_SIZE/2;
            
            // 寻找目标
            let target = null;
            let minDist = Infinity;
            
            for (let enemy of enemies) {
                const enemyData = ENEMIES[enemy.type];
                const dx = enemy.x - tx;
                const dy = enemy.y - ty;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const range = towerData.range * GRID_SIZE;
                
                if (dist <= range && dist < minDist) {
                    if (tower.type === 'blackhole' && enemyData.flying) continue;
                    minDist = dist;
                    target = enemy;
                }
            }
            
            // 修复：记录目标切换，但不重置lastFire
// 删除这行：
//            const prevTarget = tower.target;
            tower.target = target;
            
            if (!target) return;
            
            // 计算炮管角度
            tower.angle = Math.atan2(target.y - ty, target.x - tx);
            
    // ========== 激光塔：持续伤害，不生成投射物 ==========
    if (towerData.projectile === 'beam') {
        target.hp -= towerData.damage * 0.16;
        return;
    }
    
            // 充能处理（核弹）
            if (towerData.chargeTime) {
                if (tower.chargeTimer < towerData.chargeTime) {
                    tower.chargeTimer += 16;
                    return;
                }
                tower.chargeTimer = 0;
            }
            
            // 修复：检查是否可以射击，lastFire基于全局时间，不受切换目标影响
            const timeSinceLastFire = timestamp - tower.lastFire;
            if (timeSinceLastFire >= towerData.fireRate) {
                tower.lastFire = timestamp;
                fireProjectile(tower, target, towerData);
            }
        }


function applyIceEffect(enemy, proj, isDirectHit) {
    let enemyData = ENEMIES[enemy.type] || {};
    let slowAmount = proj.slow || 0.7;
    let slowDuration = proj.slowDuration || 3000;
    
    if (enemyData.flying) {
        slowAmount = Math.min(0.95, slowAmount + (proj.flyingSlowBonus || 0.2));
        slowDuration = Math.floor(slowDuration * (proj.flyingSlowDurationBonus || 2));
    }
    
    if (isDirectHit) {
        slowAmount = Math.min(0.95, slowAmount + 0.1);
    }
    
    enemy.slowAmount = slowAmount;
    enemy.slowTimer = slowDuration;
}

function fireProjectile(tower, target, towerData) {
    const tx = tower.x * GRID_SIZE + GRID_SIZE/2;
    const ty = tower.y * GRID_SIZE + GRID_SIZE/2;
    
    if (towerData.projectile === 'beam') return;
    
    if (towerData.projectile === 'blackhole') {
        const pullRange = (towerData.pullRadius || 3) * GRID_SIZE;
        const centerRadius = towerData.centerDamageRadius || 40;
        
        for (let enemy of enemies) {
            const enemyData = ENEMIES[enemy.type];
            const dx = enemy.x - tx;
            const dy = enemy.y - ty;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            let effectivePull = towerData.pullStrength || 0.4;
            if (enemyData.flying) effectivePull *= (towerData.flyingPullMult || 0.5);
            
            if (dist <= pullRange && dist > 10) {
                enemy.x -= (dx / dist) * effectivePull * 5;
                enemy.y -= (dy / dist) * effectivePull * 5;
            }
            if (dist < centerRadius) {
                // 伤害随距离衰减，中心最高
                const damage = towerData.damage * (1 + (centerRadius - dist) / centerRadius);
                // 走 damageEnemy 显示伤害数字和触发特效
                damageEnemy(enemy, damage, { color: towerData.color });
            }
        }
        return;
    }
    
    let targetX = target.x;
    let targetY = target.y;
    
    // ========== 预判优化（狙击+等离子） ==========
    if ((towerData.aimAssist || towerData.projectile === 'plasma') && target.speed) {
        // 计算敌人实际速度（考虑减速）
        let actualSpeed = target.speed;
        if (target.slowTimer > 0) {
            actualSpeed *= (1 - (target.slowAmount || 0.5));
        }
        
        const distToTarget = Math.sqrt((target.x - tx) ** 2 + (target.y - ty) ** 2);
        
        // 极近距离直瞄
        if (distToTarget < 60) {
            targetX = target.x;
            targetY = target.y;
        } else {
            const predictTime = distToTarget / towerData.projectileSpeed;
            const targetPoint = currentPath[Math.min(target.pathIndex + 1, currentPath.length - 1)];
            
            if (targetPoint) {
                const tdx = targetPoint.x * GRID_SIZE + GRID_SIZE/2 - target.x;
                const tdy = targetPoint.y * GRID_SIZE + GRID_SIZE/2 - target.y;
                const tdist = Math.sqrt(tdx * tdx + tdy * tdy);
                
                if (tdist > 0) {
                    const moveAngle = Math.atan2(tdy, tdx);
                    
                    // 如果弹丸到达前敌人会转过弯，直接瞄转弯后的方向
                    const framesToTurn = tdist / actualSpeed;
                    if (predictTime >= framesToTurn && target.pathIndex + 2 < currentPath.length) {
                        const afterTurn = currentPath[target.pathIndex + 2];
                        targetX = afterTurn.x * GRID_SIZE + GRID_SIZE/2;
                        targetY = afterTurn.y * GRID_SIZE + GRID_SIZE/2;
                    } else {
                        targetX = target.x + Math.cos(moveAngle) * actualSpeed * predictTime;
                        targetY = target.y + Math.sin(moveAngle) * actualSpeed * predictTime;
                    }
                }
            }
        }
    }
    
    projectiles.push({
        x: tx, y: ty,
        target: towerData.homing ? target : null,
        targetX: targetX, targetY: targetY,
        type: towerData.projectile,
        damage: towerData.damage,
        speed: towerData.projectileSpeed || 5,
        color: towerData.color,
        life: 120,
        splash: towerData.splash || 0,
        pierce: towerData.pierce || false,
        pierceCount: towerData.pierceCount || 0,
        piercedEnemies: [],
        pierceDamageRetain: towerData.pierceDamageRetain || 1.0,
        slow: towerData.slow || 0,
        slowDuration: towerData.slowDuration || 0,
        slowAmount: towerData.slow || 0,
        dot: towerData.dot || false,
        dotDuration: towerData.dotDuration || 0,
        dotDamage: towerData.dotDamage || 0,
        chain: towerData.chain || 0,
        chainRange: towerData.chainRange || 0,
        chainDamageDecay: towerData.chainDamageDecay || 0.3,
        vulnerable: towerData.vulnerable || false,
        vulnerableMult: towerData.vulnerableMult || 1.3,
        vulnerableDuration: towerData.vulnerableDuration || 5000,
        hit: false,
        hitRadius: towerData.hitRadius || 15
    });
}

function updateProjectile(proj) {

    // ========== 追踪型导弹（导弹） ==========
    if (proj.target && enemies.includes(proj.target)) {
        let dx = proj.target.x - proj.x;
        let dy = proj.target.y - proj.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 0) {
            let targetAngle = Math.atan2(dy, dx);
            
            // 确保 currentAngle 初始化
            if (proj.currentAngle === undefined || isNaN(proj.currentAngle)) {
                proj.currentAngle = targetAngle;
            }
            

            
            // 正常追踪
            let angleDiff = targetAngle - proj.currentAngle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            
            let baseTurnRate = 0.18;
            let distFactor = Math.min(dist / 80, 1);
            let turnRate = baseTurnRate * distFactor + 0.03;
            
            let actualTurn = Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), turnRate);
            proj.currentAngle += actualTurn;
            
            // 防NaN
            if (isNaN(proj.currentAngle)) proj.currentAngle = targetAngle;
            
            proj.x += Math.cos(proj.currentAngle) * proj.speed;
            proj.y += Math.sin(proj.currentAngle) * proj.speed;
            proj.life--;
            
            // 防NaN坐标
            if (isNaN(proj.x) || isNaN(proj.y)) {
                proj.hit = true;
                return;
            }
            
            // 命中判定
            let hitThreshold = Math.max(8, proj.hitRadius || 15);
            if (dist < hitThreshold || proj.life <= 0) {
                proj.hit = true;
                handleProjectileHit(proj);
            }
            return;
        }
    }
    
    // ========== 非追踪弹（狙击、等离子、冰冻、电击等） ==========
    let dx = proj.targetX - proj.x;
    let dy = proj.targetY - proj.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    let hitThreshold = Math.max(5, proj.hitRadius || 15);
    
    if (dist < hitThreshold || proj.life <= 0) {
        proj.hit = true;
        handleProjectileHit(proj);
    } else {
        proj.x += (dx / dist) * proj.speed;
        proj.y += (dy / dist) * proj.speed;
        proj.life--;
    }
}

function handleProjectileHit(proj) {
    // ========== 范围伤害（冰冻、火焰、导弹） ==========
    if (proj.splash > 0) {
        let splashRange = proj.splash * GRID_SIZE;
        let hitAny = false;
        
        for (let enemy of enemies) {
            let alreadyHit = proj.piercedEnemies && proj.piercedEnemies.includes(enemy);
            
            let edx = enemy.x - proj.x;
            let edy = enemy.y - proj.y;
            let edist = Math.sqrt(edx * edx + edy * edy);
            
            if (edist <= splashRange) {
                hitAny = true;
                
                if (proj.type === 'ice') {
                    // 冰冻：上减速，伤害只打一次
                    applyIceEffect(enemy, proj, edist <= splashRange * 0.5);
                    if (!alreadyHit) {
                        damageEnemy(enemy, proj.damage, proj);
                        if (!proj.piercedEnemies) proj.piercedEnemies = [];
                        proj.piercedEnemies.push(enemy);
                    }
                } else {
                    // 火焰、导弹等范围伤害
                    let damage = proj.damage * (1 - edist / splashRange * 0.5);
                    damageEnemy(enemy, damage, proj);
                }
            }
        }
        
        createParticles(proj.x, proj.y, proj.color, 15);
        
        // 冰冻塔无穿透，命中即结束
        if (proj.type === 'ice') {
            proj.hit = true;
            return;
        }
        
        // 导弹等有穿透+范围，继续判断
        if (!hitAny) proj.hit = true;
        return;
    }
    
    // ========== 单体伤害（狙击、等离子、电击） ==========
    let hitEnemy = null;
    let closestDist = Infinity;
    
    for (let enemy of enemies) {
        if (proj.piercedEnemies && proj.piercedEnemies.includes(enemy)) continue;
        
        let edx = enemy.x - proj.x;
        let edy = enemy.y - proj.y;
        let edist = Math.sqrt(edx * edx + edy * edy);
        
        if (edist < (proj.hitRadius || 20) && edist < closestDist) {
            closestDist = edist;
            hitEnemy = enemy;
        }
    }
    
    if (hitEnemy) {
        damageEnemy(hitEnemy, proj.damage, proj);
        
        // 穿透处理（狙击、等离子）
        if (proj.pierce && proj.pierceCount > 0) {
            proj.pierceCount--;
            if (!proj.piercedEnemies) proj.piercedEnemies = [];
            proj.piercedEnemies.push(hitEnemy);
            proj.hit = false;
            
            // 非追踪弹：重新瞄准最近敌人
            if (proj.target === null) {
                let nextTarget = null;
                let bestScore = Infinity;
                
    // 当前飞行方向
    const currentAngle = Math.atan2(proj.targetY - proj.y, proj.targetX - proj.x);
    
    for (let enemy of enemies) {
        if (proj.piercedEnemies.includes(enemy)) continue;
        
        let ndx = enemy.x - proj.x;
        let ndy = enemy.y - proj.y;
        let ndist = Math.sqrt(ndx * ndx + ndy * ndy);
        
        if (ndist < 200) {
            let enemyAngle = Math.atan2(ndy, ndx);
            let angleDiff = enemyAngle - currentAngle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            
            // 限制 ±30°（非追踪弹不应该拐大弯）
            if (Math.abs(angleDiff) <= Math.PI * 0.16) {
                let score = Math.abs(angleDiff) * 100 + ndist * 0.3;
                if (score < bestScore) {
                    bestScore = score;
                    nextTarget = enemy;
                }
            }
        }
    }
    
    if (nextTarget) {
        proj.targetX = nextTarget.x;
        proj.targetY = nextTarget.y;
    }
    // 找不到就保持原方向继续飞
}
        } else if (proj.chain > 0) {
            chainLightning(hitEnemy.x, hitEnemy.y, proj.chain, proj.chainRange * GRID_SIZE,
                proj.damage * (1 - proj.chainDamageDecay), proj);
        }
    } else if (proj.chain > 0) {
        chainLightning(proj.x, proj.y, proj.chain, proj.chainRange * GRID_SIZE,
            proj.damage * (1 - proj.chainDamageDecay), proj);
    }
}
function damageEnemy(enemy, damage, proj) {
    let enemyData = ENEMIES[enemy.type] || ENEMIES.basic;
    let finalDamage = damage;
    
    // 护甲减伤
    if (enemyData.armor) {
        finalDamage *= (1 - enemyData.armor);
    }
    
    // 易伤增伤
    if (enemy.vulnerableTimer > 0) {
        finalDamage *= (proj.vulnerableMult || 1.3);
    }
    
    // 穿透衰减
    if (proj.pierceDamageRetain && proj.piercedEnemies && proj.piercedEnemies.length > 0) {
        let retain = Math.pow(proj.pierceDamageRetain, proj.piercedEnemies.length);
        finalDamage *= retain;
    }
    
    enemy.hp -= finalDamage;
    
    // 减速（仅非冰冻类型，避免和 applyIceEffect 重复）
    if (proj.slow > 0 && proj.type !== 'ice') {
        enemy.slowAmount = proj.slowAmount || proj.slow;
        enemy.slowTimer = proj.slowDuration || 2000;
    }
    
    // DOT
    if (proj.dot) {
        enemy.dotTimer = proj.dotDuration || 5000;
        enemy.dotDamage = proj.dotDamage || 0;
    }
    
    // 易伤debuff
    if (proj.vulnerable) {
        enemy.vulnerableTimer = proj.vulnerableDuration || 5000;
        showBuff(enemy.x, enemy.y - 30, '易伤!', '#27ae60');
    }
    
    showDamage(enemy.x, enemy.y, Math.floor(finalDamage));
}

        function chainLightning(x, y, chainCount, range, damage, originalProj) {
            if (chainCount <= 0 || damage < 5) return;
            
            let closest = null;
            let minDist = Infinity;
            
            for (let enemy of enemies) {
                if (originalProj.piercedEnemies?.includes(enemy)) continue;
                if (originalProj.hitEnemies?.includes(enemy)) continue;
                
                const dx = enemy.x - x;
                const dy = enemy.y - y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist <= range && dist < minDist && dist > 5) {
                    minDist = dist;
                    closest = enemy;
                }
            }
            
            if (closest) {
                closest.hp -= damage;
                if (!originalProj.hitEnemies) originalProj.hitEnemies = [];
                originalProj.hitEnemies.push(closest);
                
                showDamage(closest.x, closest.y, Math.floor(damage));
                
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 2 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(x, y);
                const midX = (x + closest.x) / 2 + (Math.random() - 0.5) * 30;
                const midY = (y + closest.y) / 2 + (Math.random() - 0.5) * 30;
                ctx.lineTo(midX, midY);
                ctx.lineTo(closest.x, closest.y);
                ctx.stroke();
                
                const nextDamage = damage * (1 - (originalProj.chainDamageDecay || 0.2));
                chainLightning(closest.x, closest.y, chainCount - 1, range, nextDamage, originalProj);
            }
        }

        function showDamage(x, y, damage) {
            const div = document.createElement('div');
            div.className = 'damage-text';
            div.textContent = damage;
            const rect = canvas.getBoundingClientRect();
            div.style.left = (rect.left + x * (rect.width / CANVAS_WIDTH)) + 'px';
            div.style.top = (rect.top + y * (rect.height / CANVAS_HEIGHT) - 20) + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }

        function showBuff(x, y, text, color) {
            const div = document.createElement('div');
            div.className = 'buff-indicator';
            div.textContent = text;
            div.style.color = color;
            const rect = canvas.getBoundingClientRect();
            div.style.left = (rect.left + x * (rect.width / CANVAS_WIDTH)) + 'px';
            div.style.top = (rect.top + y * (rect.height / CANVAS_HEIGHT)) + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1500);
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 20 + Math.random() * 20,
                    color: color,
                    size: 2 + Math.random() * 3
                });
            }
        }

        // ============ 渲染 ============
        function render() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 网格
            ctx.strokeStyle = '#1a1a3e';
            ctx.lineWidth = 1;
            for (let x = 0; x <= CANVAS_WIDTH; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= CANVAS_HEIGHT; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            
            // 路径
            ctx.fillStyle = '#1a3a3a';
            for (let cell of pathCells) {
                ctx.fillRect(cell.x * GRID_SIZE + 1, cell.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            }
            
            if (currentPath.length > 0) {
                const start = currentPath[0];
                const end = currentPath[currentPath.length - 1];
                
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(start.x * GRID_SIZE + 5, start.y * GRID_SIZE + 5, GRID_SIZE - 10, GRID_SIZE - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText('起', start.x * GRID_SIZE + 12, start.y * GRID_SIZE + 25);
                
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(end.x * GRID_SIZE + 5, end.y * GRID_SIZE + 5, GRID_SIZE - 10, GRID_SIZE - 10);
                ctx.fillStyle = '#fff';
                ctx.fillText('终', end.x * GRID_SIZE + 12, end.y * GRID_SIZE + 25);
            }
            
            // 防御塔
            for (let tower of towers) {
                const towerData = TOWERS[tower.type];
                const tx = tower.x * GRID_SIZE + GRID_SIZE/2;
                const ty = tower.y * GRID_SIZE + GRID_SIZE/2;
                
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(tower.x * GRID_SIZE + 2, tower.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
                
                ctx.fillStyle = towerData.color;
                ctx.beginPath();
                ctx.arc(tx, ty, 14, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx + Math.cos(tower.angle) * 18, ty + Math.sin(tower.angle) * 18);
                ctx.stroke();
                
                const gridX = Math.floor(mouseX / GRID_SIZE);
                const gridY = Math.floor(mouseY / GRID_SIZE);
                if (gridX === tower.x && gridY === tower.y) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(tx, ty, towerData.range * GRID_SIZE, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            // 放置预览
            if (selectedTower && gameState !== 'gameover') {
                const gridX = Math.floor(mouseX / GRID_SIZE);
                const gridY = Math.floor(mouseY / GRID_SIZE);
                const towerData = TOWERS[selectedTower];
                
                if (gridX >= 0 && gridX < COLS && gridY >= 0 && gridY < ROWS) {
                    const px = gridX * GRID_SIZE + GRID_SIZE/2;
                    const py = gridY * GRID_SIZE + GRID_SIZE/2;
                    
                    const canPlace = !isPath(gridX, gridY) && !towers.some(t => t.x === gridX && t.y === gridY);
                    
                    ctx.strokeStyle = canPlace ? 'rgba(46, 204, 113, 0.5)' : 'rgba(231, 76, 60, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(px, py, towerData.range * GRID_SIZE, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    
                    ctx.fillStyle = canPlace ? 'rgba(46, 204, 113, 0.5)' : 'rgba(231, 76, 60, 0.5)';
                    ctx.fillRect(gridX * GRID_SIZE + 2, gridY * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
                }
            }
            
            // 敌人
            for (let enemy of enemies) {
                const enemyData = ENEMIES[enemy.type];
                
                // 状态效果可视化
                if (enemy.slowTimer > 0) {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemyData.radius + 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                if (enemy.dotTimer > 0) {
                    ctx.fillStyle = 'rgba(39, 174, 96, 0.3)';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemyData.radius + 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                if (enemy.vulnerableTimer > 0) {
                    ctx.fillStyle = 'rgba(39, 174, 96, 0.2)';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemyData.radius + 8, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // 飞行怪标识
                if (enemyData.flying) {
                    ctx.fillStyle = 'rgba(155, 89, 182, 0.3)';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemyData.radius + 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.fillStyle = enemyData.color;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemyData.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 血条
                const barWidth = enemyData.radius * 2;
                const barHeight = 4;
                const barX = enemy.x - barWidth / 2;
                const barY = enemy.y - enemyData.radius - 8;
                
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                
                const hpPercent = Math.max(0, enemy.hp / enemy.maxHp);
                ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f39c12' : '#e74c3c';
                ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
                
                if (enemyData.boss) {
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('BOSS', enemy.x, enemy.y + 4);
                }
            }
            
            // 投射物
            for (let proj of projectiles) {
                ctx.fillStyle = proj.color;
                
                switch(proj.type) {
                    case 'bullet':
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'cannon':
                        ctx.fillRect(proj.x - 5, proj.y - 5, 10, 10);
                        break;
                    case 'laser':
                        ctx.fillRect(proj.x - 3, proj.y - 3, 6, 6);
                        ctx.strokeStyle = proj.color;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(proj.x, proj.y);
                        const angle = Math.atan2(proj.targetY - proj.y, proj.targetX - proj.x);
                        ctx.lineTo(proj.x - Math.cos(angle) * 25, proj.y - Math.sin(angle) * 25);
                        ctx.stroke();
                        break;
                    case 'missile':
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#e74c3c';
                        ctx.beginPath();
                        ctx.arc(proj.x - (proj.targetX - proj.x) * 0.08, 
                               proj.y - (proj.targetY - proj.y) * 0.08, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'flame':
                        ctx.fillStyle = `hsl(${20 + Math.random() * 40}, 100%, 50%)`;
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 6 + Math.random() * 4, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'ice':
                        ctx.fillStyle = '#aed6f1';
                        ctx.beginPath();
                        ctx.moveTo(proj.x, proj.y - 7);
                        ctx.lineTo(proj.x + 6, proj.y + 5);
                        ctx.lineTo(proj.x - 6, proj.y + 5);
                        ctx.closePath();
                        ctx.fill();
                        // 冰晶效果
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(proj.x, proj.y - 4);
                        ctx.lineTo(proj.x, proj.y + 3);
                        ctx.stroke();
                        break;
                    case 'lightning':
                        ctx.strokeStyle = '#f1c40f';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(proj.x, proj.y);
                        ctx.lineTo(proj.x + (Math.random() - 0.5) * 12, proj.y + (Math.random() - 0.5) * 12);
                        ctx.stroke();
                        break;
                    case 'poison':
                        ctx.fillStyle = '#27ae60';
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#2ecc71';
                        ctx.beginPath();
                        ctx.arc(proj.x + 2, proj.y - 2, 2, 0, Math.PI * 2);
                        ctx.fill();
                        // 毒气拖尾
                        ctx.fillStyle = 'rgba(39, 174, 96, 0.3)';
                        ctx.beginPath();
                        ctx.arc(proj.x - 3, proj.y + 1, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'plasma':
                        ctx.fillStyle = '#9b59b6';
                        ctx.beginPath();
                        ctx.arc(proj.x, proj.y, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#e8daef';
                        ctx.beginPath();
